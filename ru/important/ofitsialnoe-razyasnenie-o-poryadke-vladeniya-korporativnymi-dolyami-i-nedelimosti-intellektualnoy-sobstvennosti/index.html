        <h1>Официальное разъяснение о порядке владения корпоративными долями и неделимости интеллектуальной собственности M.A.R.S. COMPANION LLC</h1>
        <p>Саркисян Александр Давидович · M.A.R.S. COMPANION LLC · 2026-11-20</p>
        <p>В связи с поступающими запросами и в целях обеспечения абсолютной корпоративной прозрачности, руководство M.A.R.S. COMPANION LLC публикует официальное правовое разъяснение относительно структуры собственности, порядка распределения долей и защиты нематериальных активов компании.</p>
        <h2>1. Правовой статус интеллектуальной собственности и патентного портфеля</h2>
        <p>Основу рыночной оценки M.A.R.S. COMPANION LLC в размере $5,350,000 USD составляет портфель из 26 патентных заявок UK IPO, а также David Sargsyan AI Research Lab и работающий прототип MARS-001.</p>
        <p>В соответствии с международным корпоративным правом и законодательством Республики Армения:</p>
        <ul><li>20 патентных заявок (GB2624388.1 – GB2626674.2) находятся на балансе юридического лица и являются исключительной собственностью компании, а не личным имуществом физических лиц.</li><li>6 базовых патентных заявок принадлежат лично главному системному архитектору Александру Саркисяну на правах автора и защищены международным патентным правом. Данные активы были созданы и зарегистрированы вне рамок каких-либо гражданско-правовых союзов или семейных отношений.</li></ul>
        <h2>2. Влияние институтов гражданского брака и семейного права на доли компании</h2>
        <p>Руководство компании подчеркивает, что любые изменения в личной жизни участников общества, включая вступление в законный брак или его расторжение, не имеют юридической силы в отношении структуры владения компанией и не могут служить основанием для отчуждения долей или разделения имущества.</p>
        <ul><li>Имущество компании обособлено: Имущество, созданное или приобретенное юридическим лицом, принадлежит самому юридическому лицу, а не его учредителям. Личные неимущественные или семейные обязательства физических лиц не распространяются на активы M.A.R.S. COMPANION LLC.</li><li>Защита долей: Корпоративная структура компании и её Устав полностью исключают возможность автоматического перехода долей или прав управления третьим лицам на основании семейного законодательства. Любые притязания третьих лиц на распределение долей вне инвестиционных раундов признаются ничтожными.</li></ul>
        <p>M.A.R.S. COMPANION LLC продолжает работу в штатном режиме, обеспечивая абсолютную юридическую безопасность своих разработок и суверенных ИИ-архитектур.</p>
