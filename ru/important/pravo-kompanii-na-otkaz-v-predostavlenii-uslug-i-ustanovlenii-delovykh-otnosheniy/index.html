        <h1>Право компании на отказ в предоставлении услуг и установлении деловых отношений</h1>
        <p>Автор: Саркисян Александр Давидович · M.A.R.S. COMPANION LLC</p>
        <p>Компания сохраняет право самостоятельно определять условия осуществления своей деятельности, выбирать потенциальных клиентов и деловых партнёров, а также принимать решения относительно начала, продолжения или прекращения сотрудничества в пределах применимого законодательства.</p>
        <p>Руководство компании вправе оценивать целесообразность взаимодействия, устанавливать внутренние требования к сотрудничеству и принимать самостоятельные коммерческие решения.</p>
        <p>Компания вправе отказать в рассмотрении предложения о сотрудничестве, заключении нового договора или предоставлении добровольной услуги без публичного раскрытия внутренних мотивов такого решения, если иное не предусмотрено законодательством или действующими договорными обязательствами.</p>
        <p>Компания не обязана принимать каждое поступающее предложение, вступать в деловые отношения с каждым заинтересованным лицом или предоставлять индивидуальные объяснения по каждому решению, если соответствующая обязанность не установлена законом или договором.</p>
        <p>Настоящие принципы распространяются также на деловые отношения с представителями, подрядчиками и партнёрами компании в пределах их самостоятельных полномочий и применимого законодательства.</p>
        <p>При этом компания уважает требования законодательства о недопустимости дискриминации, правила публичных договоров, права потребителей и обязательства, принятые на себя в рамках действующих договоров.</p>
        <p>Принцип компании: сотрудничество основывается на взаимном уважении, добровольности, доверии и согласии сторон. Ни одно лицо не приобретает безусловного права требовать установления деловых отношений исключительно на основании собственного желания.</p>
        <p>Настоящее уведомление носит информационный характер и не заменяет индивидуальные договорные условия или требования законодательства.</p>
