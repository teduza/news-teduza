        <h1>Official Clarification on Corporate Share Ownership and the Indivisibility of Intellectual Property of M.A.R.S. COMPANION LLC</h1>
        <p>Aleksandr Sarkisian · M.A.R.S. COMPANION LLC · 2026-11-20</p>
        <p>In response to incoming inquiries and in order to ensure absolute corporate transparency, the management of M.A.R.S. COMPANION LLC publishes this official legal clarification regarding the Company's ownership structure, share distribution rules, and the protection of its intangible assets.</p>
        <h2>1. Legal Status of Intellectual Property and the Patent Portfolio</h2>
        <p>The foundation of M.A.R.S. COMPANION LLC's market valuation of $5,350,000 USD consists of a portfolio of 26 UK IPO patent applications, together with the David Sargsyan AI Research Lab and the working MARS-001 prototype.</p>
        <p>In accordance with international corporate law and the legislation of the Republic of Armenia:</p>
        <ul><li>20 patent applications (GB2624388.1 – GB2626674.2) are held on the balance sheet of the legal entity and constitute the exclusive property of the Company, rather than the personal property of any natural persons.</li><li>6 foundational patent applications belong personally to Lead System Architect Aleksandr Sarkisian as the inventor and author and are protected under international patent law. These assets were created and registered outside the scope of any civil unions or family relationships.</li></ul>
        <h2>2. Effect of Civil Marriage and Family Law on Company Shares</h2>
        <p>The Company's management emphasizes that any changes in the personal lives of the Company's participants, including entering into or dissolving a legal marriage, carry no legal force with respect to the Company's ownership structure and cannot serve as grounds for the alienation of shares or the division of corporate property.</p>
        <ul><li>Corporate Asset Separation: Property created or acquired by a legal entity belongs exclusively to that legal entity, not to its founders. Personal non-property or family obligations of natural persons do not extend to the assets of M.A.R.S. COMPANION LLC.</li><li>Share Protection: The Company's corporate structure and Articles of Association completely exclude any automatic transfer of shares or governance rights to third parties under family law. Any third-party claims to share allocation outside authorized investment rounds are deemed null and void.</li></ul>
        <p>M.A.R.S. COMPANION LLC continues to operate in normal course, ensuring absolute legal security for its developments and sovereign AI architectures.</p>
